<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7e8">
<link rel="manifest" href="manifest.webmanifest">
<title>Affirmation</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
background:linear-gradient(160deg,#fff7e8,#f8f0ff);color:#333;padding:24px}
.wrap{width:min(100%,460px);margin:0 auto}.card{background:#fff;border-radius:28px;padding:28px 22px;
box-shadow:0 12px 40px rgba(0,0,0,.10);text-align:center;margin-bottom:18px}
h1{margin:0 0 7px;font-size:32px}.sub{margin:0 0 25px;color:#777}
#praise{min-height:110px;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1.6;font-weight:700;margin-bottom:24px}
button{border:0;border-radius:999px;padding:15px 20px;font-size:17px;font-weight:700;width:100%;-webkit-tap-highlight-color:transparent}
.primary{background:#333;color:#fff}.secondary{background:#f1edf7;color:#444}.danger{background:#fff0f0;color:#b33}
button:active{transform:scale(.98)}
input[type="text"]{width:100%;padding:15px;border:1px solid #ddd;border-radius:14px;font-size:16px;margin:10px 0}
input[type="file"]{display:none}
.upload{display:block;padding:15px 20px;border-radius:999px;background:#f1edf7;color:#444;font-size:17px;font-weight:700;cursor:pointer}
h2{font-size:20px;margin:0 0 12px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.sectionHead h2{margin:0}.toggle{width:auto;padding:9px 13px;font-size:13px;background:#f1edf7;color:#555;white-space:nowrap}.list{text-align:left;margin-top:15px}
.item{display:flex;gap:8px;align-items:center;border-top:1px solid #eee;padding:11px 0}
.item span{flex:1;line-height:1.45}.del{width:auto;padding:8px 12px;font-size:13px}
.small{margin-top:14px;color:#999;font-size:12px}
.imageViewer{margin:0 auto 16px;min-height:0;display:flex;justify-content:center;align-items:center}.imageViewer img{max-width:100%;max-height:360px;border-radius:18px;display:block;box-shadow:0 8px 24px rgba(0,0,0,.10)}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.photo{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#eee}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button{position:absolute;right:5px;top:5px;width:auto;padding:6px 9px;font-size:12px;background:rgba(255,255,255,.9);color:#b33}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>Affirmation</h1>
<p class="sub">今日の自分に、やさしい言葉を。</p>
<div id="praise">ボタンを押して、今日の自分を褒めよう。</div>
<button class="primary" id="praiseButton">今日の自分を褒める</button>
<div class="small">小さな一歩も、ちゃんと前進。</div>
<div id="imageViewer" class="imageViewer" aria-live="polite"></div>
<button class="secondary" id="randomImageButton" type="button">🖼️ 今日の画像を見る</button>
</div>

<div class="card">
<div class="sectionHead"><h2>✏️ 褒め言葉を追加</h2><button class="toggle" id="togglePraises" type="button"></button></div>
<input id="newPraise" type="text" maxlength="100" placeholder="自分にかけたい言葉を入力">
<button class="secondary" id="addButton">この言葉を追加する</button>
<div id="list" class="list"></div>
</div>

<div class="card">
<div class="sectionHead"><h2>🖼️ 好きな画像を追加</h2><button class="toggle" id="toggleImages" type="button"></button></div>
<label class="upload" for="imageInput">写真・画像を選ぶ</label>
<input id="imageInput" type="file" accept="image/*" multiple>
<div id="gallery" class="gallery"></div>
<div class="small">追加した画像はこのiPhoneのブラウザに保存されます。</div>
</div>
</div>

<script>
const defaultPraises=[
"今日もここまで頑張った自分、素晴らしい！","新しいことに挑戦した自分、えらい！",
"ちゃんと自分と向き合っている自分、素敵だよ。","焦らず一歩ずつ進んでいる自分、いい感じ！",
"今日できたことを、ちゃんと認めてあげよう。","疲れたら休もうと思える自分も、立派だよ。",
"昨日より少しでも前に進んだ自分、よくやった！","自分を大切にしようとしている自分、素晴らしい。",
"完璧じゃなくていい。今日も十分頑張ったよ。","小さな積み重ねを続けている自分、かっこいい！",
"今日の自分に、まずは「ありがとう」。","できなかったことより、できたことを見てあげよう。",
"自分のペースを大切にしている自分、いいね！","ここまで頑張ってきた自分、本当にお疲れさま。"
];
const KEY="affirmationPraises", IMGKEY="affirmationImages";
const PRAISE_HIDE_KEY="affirmationHidePraises", IMAGE_HIDE_KEY="affirmationHideImages";
let userPraises=JSON.parse(localStorage.getItem(KEY)||"[]");
let images=JSON.parse(localStorage.getItem(IMGKEY)||"[]"), last=-1;
let hidePraises=localStorage.getItem(PRAISE_HIDE_KEY)==="1";
let hideImages=localStorage.getItem(IMAGE_HIDE_KEY)==="1", lastImage=-1;

function allPraises(){return [...defaultPraises,...userPraises]}
function showPraise(){
 const p=allPraises(); let i;
 do{i=Math.floor(Math.random()*p.length)}while(i===last&&p.length>1);
 last=i; document.getElementById("praise").textContent=p[i];
}
function saveP(){localStorage.setItem(KEY,JSON.stringify(userPraises))}
function showRandomImage(){
 if(!images.length){alert("先に好きな画像を追加してください😊");return}
 let i;
 do{i=Math.floor(Math.random()*images.length)}while(i===lastImage&&images.length>1);
 lastImage=i;
 const viewer=document.getElementById("imageViewer");
 viewer.innerHTML="";
 const img=document.createElement("img");
 img.src=images[i];
 img.alt="今日の画像";
 viewer.appendChild(img);
}
function updateToggleButtons(){
 const pb=document.getElementById("togglePraises"), ib=document.getElementById("toggleImages");
 pb.textContent=hidePraises?"表示":"隠す";
 ib.textContent=hideImages?"表示":"隠す";
 pb.setAttribute("aria-label",hidePraises?"追加した褒め言葉を表示":"追加した褒め言葉を隠す");
 ib.setAttribute("aria-label",hideImages?"追加した画像を表示":"追加した画像を隠す");
}
function renderList(){
 const list=document.getElementById("list");
 list.style.display=hidePraises?"none":"block";
 if(!userPraises.length){list.innerHTML='<div class="small">まだ自分で追加した言葉はありません。</div>';return}
 list.innerHTML="";
 userPraises.forEach((t,i)=>{
  const row=document.createElement("div");row.className="item";
  const s=document.createElement("span");s.textContent=t;
  const b=document.createElement("button");b.className="danger del";b.textContent="削除";
  b.onclick=()=>{userPraises.splice(i,1);saveP();renderList()};
  row.append(s,b);list.append(row);
 });
}
function saveImages(next=images){
 const payload=JSON.stringify(next);
 try{localStorage.setItem(IMGKEY,payload);return true}
 catch(err){return false}
}

const MAX_IMAGE_SIDE=1280;
const JPEG_QUALITY=0.72;
const MAX_TOTAL_IMAGE_CHARS=3200000;

function compressImage(source){
 return new Promise((resolve,reject)=>{
  const img=new Image();
  img.onload=()=>{
   let w=img.naturalWidth,h=img.naturalHeight;
   const scale=Math.min(1,MAX_IMAGE_SIDE/Math.max(w,h));
   w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
   const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
   const ctx=canvas.getContext("2d");
   ctx.drawImage(img,0,0,w,h);
   resolve(canvas.toDataURL("image/jpeg",JPEG_QUALITY));
  };
  img.onerror=reject;
  img.src=source;
 });
}

async function compressFile(file){
 const data=await new Promise((resolve,reject)=>{
  const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);
 });
 return compressImage(data);
}

async function migrateOldImages(){
 if(!images.length)return;
 try{
  const compressed=[];
  for(const src of images){compressed.push(await compressImage(src));}
  if(compressed.join("").length < MAX_TOTAL_IMAGE_CHARS && saveImages(compressed)){
   images=compressed;
   renderGallery();
  }
 }catch(e){/* 既存データが壊れていてもアプリ本体は使えるようにする */}
}
function renderGallery(){
 const g=document.getElementById("gallery");g.innerHTML="";
 g.style.display=hideImages?"none":"grid";
 if(!images.length){g.innerHTML='<div class="small" style="grid-column:1/-1">まだ画像はありません。</div>';return}
 images.forEach((src,i)=>{
  const box=document.createElement("div");box.className="photo";
  const img=document.createElement("img");img.src=src;
  const b=document.createElement("button");b.textContent="削除";b.onclick=()=>{images.splice(i,1);saveImages();renderGallery()};
  box.append(img,b);g.append(box);
 });
}
document.getElementById("praiseButton").onclick=showPraise;
document.getElementById("randomImageButton").onclick=showRandomImage;
document.getElementById("togglePraises").onclick=()=>{hidePraises=!hidePraises;localStorage.setItem(PRAISE_HIDE_KEY,hidePraises?"1":"0");renderList();updateToggleButtons()};
document.getElementById("toggleImages").onclick=()=>{hideImages=!hideImages;localStorage.setItem(IMAGE_HIDE_KEY,hideImages?"1":"0");renderGallery();updateToggleButtons()};
document.getElementById("addButton").onclick=()=>{
 const input=document.getElementById("newPraise"),text=input.value.trim();
 if(!text){alert("褒め言葉を入力してください😊");return}
 if(userPraises.includes(text)){alert("その言葉はすでに追加されています。");return}
 userPraises.push(text);saveP();input.value="";renderList();alert("褒め言葉を追加しました！😊");
};
document.getElementById("newPraise").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("addButton").click()});
document.getElementById("imageInput").addEventListener("change",async e=>{
 const files=[...e.target.files];
 let added=0;
 try{
  for(const file of files){
   if(!file.type.startsWith("image/"))continue;
   const compressed=await compressFile(file);
   const next=[...images,compressed];
   if(JSON.stringify(next).length>MAX_TOTAL_IMAGE_CHARS || !saveImages(next)){
    alert("画像の保存容量がいっぱいです。画像を少し削除してから追加してください😊");
    break;
   }
   images=next;added++;
  }
  renderGallery();
 }catch(err){
  alert("画像の処理に失敗しました。別の画像でもう一度試してください😊");
 }
 e.target.value="";
});
renderList();renderGallery();updateToggleButtons();
migrateOldImages();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
